<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:966px;height:325px;background:#FFFFFF;" width="966px" height="325px" viewBox="0 0 966 325" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity R--><g class="entity" data-qualified-name="R" id="ent0001" data-source-line="6"><rect x="704.44" y="24.7" width="247.851" height="143.942" fill="#FEF3C7" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="714.44" y="48.597" fill="#000" font-size="13" textLength="35.139" font-weight="700" font-family="Helvetica">Rules</text><text x="714.44" y="66.303" fill="#000" font-size="13" textLength="190.528" font-family="Helvetica">what the agent must always do</text><text x="714.44" y="84.009" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="714.44" y="101.715" fill="#000" font-size="13" textLength="146.224" font-style="italic" font-family="Helvetica">AGENTS.md / CLAUDE.md</text><text x="714.44" y="119.421" fill="#000" font-size="13" textLength="227.851" font-family="Helvetica">always in context · reviewed like code</text><text x="714.44" y="137.127" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="714.44" y="154.833" fill="#000" font-size="13" textLength="181.519" font-style="italic" font-family="Helvetica">e.g. tabs, phase gates, test style</text></g><!--entity S--><g class="entity" data-qualified-name="S" id="ent0002" data-source-line="7"><rect x="7" y="7" width="244.731" height="179.354" fill="#DCFCE7" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="17" y="30.897" fill="#000" font-size="13" textLength="33.995" font-weight="700" font-family="Helvetica">State</text><text x="17" y="48.603" fill="#000" font-size="13" textLength="144.911" font-family="Helvetica">where we are right now</text><text x="17" y="66.309" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="17" y="84.015" fill="#000" font-size="13" textLength="200.707" font-style="italic" font-family="Helvetica">memory/ markdown, tracked in git</text><text x="17" y="101.721" fill="#000" font-size="13" textLength="202.319" font-family="Helvetica">activeContext · progress · archive</text><text x="17" y="119.427" fill="#000" font-size="13" textLength="169.91" font-family="Helvetica">rewritten as work moves on</text><text x="17" y="137.133" fill="#000" font-size="13" textLength="190.554" font-style="italic" font-family="Helvetica">+ decisions.md (append-only log)</text><text x="17" y="154.839" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="17" y="172.545" fill="#000" font-size="13" textLength="224.731" font-style="italic" font-family="Helvetica">e.g. next step, open bugs, branch focus</text></g><!--entity F--><g class="entity" data-qualified-name="F" id="ent0003" data-source-line="8"><rect x="414.9" y="15.85" width="254.936" height="161.648" fill="#E0F2FE" style="stroke:#94A3B8;stroke-width:0.5;" rx="7" ry="7"/><text x="424.9" y="39.747" fill="#000" font-size="13" textLength="33.8" font-weight="700" font-family="Helvetica">Facts</text><text x="424.9" y="57.453" fill="#000" font-size="13" textLength="234.936" font-family="Helvetica">dated, one fact per note, still true later</text><text x="424.9" y="75.159" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="424.9" y="92.865" fill="#000" font-size="13" textLength="166.205" font-style="italic" font-family="Helvetica">jevmem (typed SQLite graph)</text><text x="424.9" y="110.571" fill="#000" font-size="13" textLength="210.223" font-family="Helvetica">recalled on demand · consolidated</text><text x="424.9" y="128.277" fill="#000" font-size="13" font-family="Helvetica"> </text><text x="424.9" y="145.983" fill="#000" font-size="13" textLength="142.883" font-style="italic" font-family="Helvetica">e.g. why Move is verified,</text><text x="424.9" y="163.689" fill="#000" font-size="13" textLength="190.463" font-style="italic" font-family="Helvetica">bug causes, gotchas, preferences</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="12"><path d="M25.58,262.2 L25.58,295.612 A6,6 0 0 0 31.58,301.612 L227.143,301.612 A6,6 0 0 0 233.143,295.612 L233.143,266.2 L223.143,256.2 L133.37,256.2 L129.37,186.74 L125.37,256.2 L31.58,256.2 A6,6 0 0 0 25.58,262.2" style="stroke:#CA8A04;stroke-width:0.5;" fill="#FEF9C3"/><path d="M223.143,256.2 L223.143,263.2 A3,3 0 0 0 226.143,266.2 L233.143,266.2 L223.143,256.2" style="stroke:#CA8A04;stroke-width:0.5;" fill="#FEF9C3"/><text x="31.58" y="275.097" fill="#000" font-size="13" textLength="186.563" font-family="Helvetica">If stored in jevmem as a "fact",</text><text x="31.58" y="292.803" fill="#000" font-size="13" textLength="122.967" font-family="Helvetica">it goes stale silently.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="17"><path d="M719.77,253.35 L719.77,304.468 A6,6 0 0 0 725.77,310.468 L930.966,310.468 A6,6 0 0 0 936.966,304.468 L936.966,257.35 L926.966,247.35 L832.37,247.35 L828.37,168.91 L824.37,247.35 L725.77,247.35 A6,6 0 0 0 719.77,253.35" style="stroke:#CA8A04;stroke-width:0.5;" fill="#FEF9C3"/><path d="M926.966,247.35 L926.966,254.35 A3,3 0 0 0 929.966,257.35 L936.966,257.35 L926.966,247.35" style="stroke:#CA8A04;stroke-width:0.5;" fill="#FEF9C3"/><text x="725.77" y="266.247" fill="#000" font-size="13" textLength="172.159" font-family="Helvetica">Duplicated in recall = tokens</text><text x="725.77" y="283.953" fill="#000" font-size="13" textLength="159.835" font-family="Helvetica">spent twice (jevmem skips</text><text x="725.77" y="301.659" fill="#000" font-size="13" textLength="196.196" font-family="Helvetica">notes AGENTS.md already says).</text></g><!--link S to F--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="10" data-link-type="dependency"><path d="M252.16,96.67 C303.4,96.67 357.92,96.67 409.67,96.67" style="stroke:#475569;stroke-width:1;" fill="none" id="S-to-F"/><polygon points="414.67,96.67,405.67,92.67,409.67,96.67,405.67,100.67,414.67,96.67" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="269.81" y="53.567" fill="#334155" font-size="13" textLength="127.504" font-family="Helvetica">a significant decision</text><text x="277.389" y="71.273" fill="#334155" font-size="13" textLength="112.346" font-family="Helvetica">is also written as a</text><text x="292.853" y="88.979" fill="#334155" font-size="13" textLength="81.419" font-family="Helvetica">one-fact note</text></g><!--link F to R--><?plantuml-src NLFDZjCm4BxdAORkPRUq3NyI4X98gsw3a1OaMZXH3guzJKoTSMHF6g8LpyMT9sESTEcobyJnJERxivzOqgur295xXmlRrYwB1qkD2gg6W9eLbGxXBWDO-vRCqWV20CzVPR-ox5oVJAVhrc6SJhVKLOg1AmHL8Z7KRMHGhbDz1EEtjAKyltw_-lHbiwWDvB2ylVvwiv9rdc_fr6S9j2V6dmn_VWkDeyKE3JXxG2aO7AVWebm0grsSGLEfY50gHlcG1u-2ydm2Ai8QBefLyNBv-d_66vR-aJ46X4uOoolOic8WtuqWDTO-z3dKAXoCxqZ61wKFmaP8bfO7rfhj4PTdnatmPS0Oqre5NKbrIm6xO9cH4gNEXmFK_eWH_83p50ng6wsdc7ovL4s3PEQUN0_EbrS9vvzeIZYHiPc1bpROjQNetWL5keAzrsqyAT_0nSsoMAuUAI-4yP2L4GUC3264lUn18zcIPvp9TEkSQ6qHd3I54Vq77iKGkEI-4GSsdsyjY-r1DTL0K42KSrBn979gHIOv8556x-o0zK14L_NmKHm06-68mUwjK4bJybpqW5PjJ6cMdhMaAna7t4jEfF5UNG4NgsV5YsALPHkO3y7Dtydk6r0GRKaoKYivWlVERacWb8iU7YIXjYJovuFy93rB3zXvPb-3tyD6Zlw7lVZXmnZwoOFqAqpIRvEPj5WMff9cP2KUH-laxBj-aKc8uzW2vjygQmpIztkcwyTOQnbqqpPEQFC8DZeARu7z0IbAFJRfLd5dDSBbYOjSsIRLqhW8vzkbN41bUeXogQxENFu2?></g></svg>